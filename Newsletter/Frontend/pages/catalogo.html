<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - MCGames</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="../assets/icons/Logo.svg">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .mini-card-img {
            height: 140px;
            object-fit: cover;
        }

        .mini-card-title {
            font-size: 0.95rem;
            margin-bottom: 0.2rem;
        }

        .mini-card-price {
            font-size: 0.85rem;
        }

        .filter-scroll-area {
            max-height: calc(100vh - 160px);
            overflow-y: auto;
            padding-right: 5px;
        }
        .filter-scroll-area::-webkit-scrollbar {
            width: 6px;
        }

        .filter-scroll-area::-webkit-scrollbar-track {
            background: var(--bg-primary);
            border-radius: 4px;
        }

        .filter-scroll-area::-webkit-scrollbar-thumb {
            background: var(--bg-secondary);
            border-radius: 4px;
        }

        .filter-scroll-area::-webkit-scrollbar-thumb:hover {
            background: var(--accent-primary);
        }
    </style>
</head>

<body>
    <div id="navbar-container"></div>

    <main class="container-fluid px-4 mb-5 mt-4" style="min-height: 60vh;">
        <div class="row">

            <aside class="col-12 col-md-3 col-xl-2 mb-4">
                <div class="card bg-dark border-secondary sticky-top" style="top: 90px;">

                    <div class="card-header border-secondary bg-transparent pt-3 pb-2">
                        <h5 class="text-white fw-bold mb-0">
                            <i class="bi bi-funnel-fill text-accent me-2"></i>Filtros
                        </h5>
                    </div>

                    <div class="card-body filter-scroll-area p-3">

                        <div class="filter-section mb-4">
                            <h6 class="text-accent border-bottom border-secondary pb-2 mb-3">
                                <i class="bi bi-tags me-2"></i>Géneros
                            </h6>
                            <div id="filter-genres">
                                <span class="spinner-border spinner-border-sm text-accent"></span> <span
                                    class="text-secondary small">Cargando...</span>
                            </div>
                        </div>
                        <div class="filter-section mb-4">
                            <h6 class="text-accent border-bottom border-secondary pb-2 mb-3">
                                <i class="bi bi-percent me-2"></i>Promociones
                            </h6>
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" value="true" id="filter-offers"
                                    onchange="actualizarFiltroOfertas()">
                                <label class="form-check-label text-success fw-bold small" style="cursor: pointer;"
                                    for="filter-offers">
                                    Solo en Oferta %
                                </label>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="filter-discount" class="form-label text-white small fw-bold">Descuento
                                Mínimo</label>
                            <select id="filter-discount"
                                class="form-select form-select-sm bg-dark text-light border-secondary"
                                onchange="actualizarFiltroDescuento()">
                                <option value="0">Cualquier descuento</option>
                                <option value="10">10% o más</option>
                                <option value="20">20% o más</option>
                                <option value="30">30% o más</option>
                                <option value="40">40% o más</option>
                                <option value="50">50% o más</option>
                                <option value="60">60% o más</option>
                                <option value="70">70% o más</option>
                                <option value="80">80% o más</option>
                                <option value="90">90% o más</option>
                                <option value="99">99% o más</option>
                            </select>
                        </div>

                        <div class="filter-section mb-4">
                            <h6 class="text-accent border-bottom border-secondary pb-2 mb-3">
                                <i class="bi bi-pc-display me-2"></i>Plataformas
                            </h6>
                            <div id="filter-platforms">
                                <div class="form-check mb-2">
                                    <input class="form-check-input" type="checkbox" value="both" id="filter-both-stores"
                                        onchange="actualizarFiltroPlataformas()">
                                    <label class="form-check-label text-info fw-bold small" style="cursor: pointer;"
                                        for="filter-both-stores">
                                        Steam y Epic
                                    </label>
                                </div>
                                
                            </div>         
                               <div id="filter-Epic">
                                <div class="form-check mb-2">
                                    <input class="form-check-input" type="checkbox" value="both" id="filter-epic-stores"
                                        onchange="actualizarFiltroEpic()">
                                    <label class="form-check-label text-info fw-bold small" style="cursor: pointer;"
                                        for="filter-epic-stores">
                                        Epic
                                    </label>
                                </div>
                                
                            </div>
                        </div>

                    </div>
                </div>
            </aside>

            <section class="col-12 col-md-9 col-xl-10">

                <div class="row align-items-center mb-4 g-3">
                    <div class="col-12 col-lg-4">
                        <span id="catalog-info" class="text-secondary small">Cargando...</span>
                    </div>

                    <div class="col-12 col-md-6 col-lg-4">
                        <div class="d-flex align-items-center gap-2">
                            <label for="sort-select" class="text-light small text-nowrap mb-0">Ordenar por:</label>
                            <select id="sort-select"
                                class="form-select bg-dark border-secondary text-light form-select-sm"
                                onchange="cambiarOrden()">
                                <option value="releasedate_desc" selected>Lanzamiento (Más recientes)</option>
                                <option value="name_asc">Nombre (A - Z)</option>
                                <option value="name_desc">Nombre (Z - A)</option>
                                <option value="price_asc">Precio (Menor a Mayor)</option>
                                <option value="price_desc">Precio (Mayor a Menor)</option>
                            </select>
                        </div>
                    </div>

                    <div class="col-12 col-md-6 col-lg-4">
                        <div class="input-group input-group-sm">
                            <input type="text" id="search-input"
                                class="form-control bg-dark border-secondary text-light" placeholder="Buscar juego...">
                            <button class="btn btn-accent" type="button" onclick="buscarJuegosLocales()">
                                <i class="bi bi-search"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="row g-3" id="catalog-grid"></div>

                <div class="d-flex justify-content-center mt-5">
                    <nav aria-label="Navegación del catálogo">
                        <ul class="pagination pagination-sm" id="catalog-pagination"></ul>
                    </nav>
                </div>

            </section>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config/api.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/catalogo.js"></script>
</body>

</html>
