<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - PlayHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        /* Ajustes para las mini-cards */
        .mini-card-img { height: 140px; object-fit: cover; }
        .mini-card-title { font-size: 0.95rem; margin-bottom: 0.2rem; }
        .mini-card-price { font-size: 0.85rem; }

        /* 💡 Contenedor del scroll independiente para filtros */
        .filter-scroll-area {
            max-height: calc(100vh - 160px); 
            overflow-y: auto; 
            padding-right: 5px; 
        }

        /* Personalización de la barra de scroll */
        .filter-scroll-area::-webkit-scrollbar { width: 6px; }
        .filter-scroll-area::-webkit-scrollbar-track { background: var(--bg-primary); border-radius: 4px; }
        .filter-scroll-area::-webkit-scrollbar-thumb { background: var(--bg-secondary); border-radius: 4px; }
        .filter-scroll-area::-webkit-scrollbar-thumb:hover { background: var(--accent-primary); }
    </style>
</head>
<body>
    <div id="navbar-container"></div>

    <main class="container-fluid px-4 mb-5 mt-4" style="min-height: 60vh;">
        <div class="row">
            
            <aside class="col-12 col-md-3 col-xl-2 mb-4">
                <div class="card bg-dark border-secondary sticky-top" style="top: 90px;">
                    
                    <div class="card-header border-secondary bg-transparent pt-3 pb-2">
                        <h5 class="text-white fw-bold mb-0">
                            <i class="bi bi-funnel-fill text-accent me-2"></i>Filtros
                        </h5>
                    </div>
                    
                    <div class="card-body filter-scroll-area p-3">
                        
                        <div class="filter-section mb-4">
                            <h6 class="text-accent border-bottom border-secondary pb-2 mb-3">
                                <i class="bi bi-tags me-2"></i>Géneros
                            </h6>
                            <div id="filter-genres">
                                <span class="spinner-border spinner-border-sm text-accent"></span> <span class="text-secondary small">Cargando...</span>
                            </div>
                        </div>

                        <div class="filter-section mb-4">
                            <h6 class="text-accent border-bottom border-secondary pb-2 mb-3">
                                <i class="bi bi-pc-display me-2"></i>Plataformas
                            </h6>
                            <div id="filter-platforms" class="text-secondary small fst-italic text-muted">
                                Próximamente...
                            </div>
                        </div>

                    </div>
                </div>
            </aside>

            <section class="col-12 col-md-9 col-xl-10">
                
     <div class="row align-items-center mb-4 g-3">
                    <div class="col-12 col-lg-4">
                        <span id="catalog-info" class="text-secondary small">Cargando...</span>
                    </div>
                    
                    <div class="col-12 col-md-6 col-lg-4">
                        <div class="d-flex align-items-center gap-2">
                            <label for="sort-select" class="text-light small text-nowrap mb-0">Ordenar por:</label>
                            <select id="sort-select" class="form-select bg-dark border-secondary text-light form-select-sm" onchange="cambiarOrden()">
                                <option value="name_asc" selected>Nombre (A - Z)</option>
                                <option value="name_desc">Nombre (Z - A)</option>
                                <option value="price_asc">Precio (Menor a Mayor)</option>
                                <option value="price_desc">Precio (Mayor a Menor)</option>
                                <option value="date_desc">Lanzamiento (Más recientes)</option>
                            </select>
                        </div>
                    </div>

                    <div class="col-12 col-md-6 col-lg-4">
                        <div class="input-group input-group-sm">
                            <input type="text" id="search-input" class="form-control bg-dark border-secondary text-light" placeholder="Buscar juego...">
                            <button class="btn btn-accent" type="button" onclick="buscarJuegosLocales()">
                                <i class="bi bi-search"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="row g-3" id="catalog-grid"></div>

                <div class="d-flex justify-content-center mt-5">
                    <nav aria-label="Navegación del catálogo">
                        <ul class="pagination pagination-sm" id="catalog-pagination"></ul>
                    </nav>
                </div>

            </section>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config/api.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/catalogo.js"></script>
</body>
</html>
