
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Biblioteca - PlayHub</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Iconos de Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Tu CSS Personalizado -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
 <div id="navbar-container"></div>
    <!-- CONTENIDO PRINCIPAL -->
    <main class="container my-5" style="min-height: 60vh;">
        
        <div class="d-flex justify-content-between align-items-center mb-4 border-bottom border-secondary pb-3">
            <h2 class="h3 fw-bold m-0 text-white"><i class="bi bi-collection-play me-2 text-accent"></i> Mi Colección</h2>
            <div class="text-secondary" id="games-count">Cargando...</div>
        </div>

        <!-- Contenedor principal para la grilla o el mensaje de error -->
        <div id="library-container">
            <!-- Spinner de carga -->
            <div id="loading-spinner" class="text-center py-5">
                <div class="spinner-border" style="color: var(--accent-primary);" role="status">
                    <span class="visually-hidden">Cargando...</span>
                </div>
            </div>

            <!-- Grilla de juegos (Oculta hasta que cargue) -->
            <div class="row g-4 d-none" id="my-games-grid">
                <!-- JS inyectará las tarjetas aquí -->
            </div>

            <!-- Mensaje si la biblioteca está vacía (Oculto por defecto) -->
            <div id="empty-state" class="text-center py-5 d-none">
                <i class="bi bi-controller text-secondary" style="font-size: 4rem;"></i>
                <h4 class="mt-3 text-white">Tu biblioteca está vacía</h4>
                <p class="text-secondary">Aún no has agregado ningún juego a tu colección.</p>
                <a href="../index.html" class="btn btn-accent mt-3">Explorar la tienda</a>
            </div>
        </div>

    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Archivo de configuración global -->
    <script src="../js/config/api.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/library.js"></script>
</body>
</html>
