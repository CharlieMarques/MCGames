<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - PlayHub</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Iconos de Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Tu CSS Personalizado -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="d-flex align-items-center py-4" style="min-height: 100vh;">

    <main class="w-100 m-auto" style="max-width: 450px;">
        <!-- Tarjeta de Login -->
        <div class="card shadow-lg border-0" style="background-color: var(--bg-secondary); border-radius: 1rem;">
            <div class="card-body p-5 text-light">
                
                <div class="text-center mb-4">
                    <i class="bi bi-play-fill fs-1" style="color: var(--accent-secondary);"></i>
                    <h2 class="fw-bold mt-2">Iniciar Sesión</h2>
                    <p class="text-secondary" style="color: var(--text-secondary) !important;">Bienvenido de nuevo a PlayHub</p>
                </div>

                <!-- Contenedor para mostrar errores -->
                <div id="error-message" class="alert alert-danger d-none" role="alert"></div>

                <form id="loginForm">
                    <div class="mb-3">
                        <label for="username" class="form-label text-light">Nombre de Usuario</label>
                        <input type="text" class="form-control bg-dark border-secondary text-light" id="username" required placeholder="GamerX">
                    </div>

                    <div class="mb-4">
                        <div class="d-flex justify-content-between">
                            <label for="password" class="form-label text-light">Contraseña</label>
                            <a href="#" class="text-decoration-none" style="color: var(--text-secondary); font-size: 0.85rem;">¿La olvidaste?</a>
                        </div>
                        <input type="password" class="form-control bg-dark border-secondary text-light" id="password" required placeholder="••••••••">
                    </div>

                    <button class="btn btn-accent w-100 py-2 fw-bold mb-3" type="submit" id="btnSubmit">
                        Ingresar
                    </button>

                    <div class="text-center mt-3">
                        <span style="color: var(--text-secondary);">¿No tienes una cuenta?</span> 
                        <a href="registro.html" class="text-decoration-none fw-bold" style="color: var(--accent-primary);">Regístrate</a>
                    </div>
                </form>

            </div>
        </div>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Archivo de configuración global -->
    <script src="../js/config/api.js"></script>
    <!-- Lógica de Autenticación -->
    <script src="../js/auth.js"></script>
</body>
</html>
