<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - MCGames</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
   <link rel="icon" type="image/svg+xml" href="../assets/icons/Logo.svg">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="d-flex align-items-center py-4" style="min-height: 100vh;">

    <main class="w-100 m-auto" style="max-width: 450px;">
        <div class="card shadow-lg border-0" style="background-color: var(--bg-secondary); border-radius: 1rem;">
            <div class="card-body p-5 text-light">
                
                <div class="text-center mb-4">
                    <i class="bi bi-play-fill fs-1" style="color: var(--accent-secondary);"></i>
                    <h2 class="fw-bold mt-2">Crear Cuenta</h2>
                    <p class="text-secondary" style="color: var(--text-secondary) !important;">Únete a la plataforma definitiva</p>
                </div>
                <div id="error-message" class="alert alert-danger d-none" role="alert"></div>

                <form id="registerForm">
                    <div class="mb-3">
                        <label for="username" class="form-label text-light">Nombre de Usuario</label>
                        <input type="text" class="form-control bg-dark border-secondary text-light" id="username" required placeholder="GamerX">
                    </div>
                    
                    <div class="mb-3">
                        <label for="email" class="form-label text-light">Correo Electrónico</label>
                        <input type="email" class="form-control bg-dark border-secondary text-light" id="email" required placeholder="tu@email.com">
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label text-light">Contraseña</label>
                        <input type="password" class="form-control bg-dark border-secondary text-light" id="password" required placeholder="••••••••">
                    </div>

                    <div class="mb-4">
                        <label for="confirmPassword" class="form-label text-light">Confirmar Contraseña</label>
                        <input type="password" class="form-control bg-dark border-secondary text-light" id="confirmPassword" required placeholder="••••••••">
                    </div>

                    <button class="btn btn-accent w-100 py-2 fw-bold mb-3" type="submit" id="btnSubmit">
                        Registrarse
                    </button>

                    <div class="text-center mt-3">
                        <span style="color: var(--text-secondary);">¿Ya tienes una cuenta?</span> 
                        <a href="login.html" class="text-decoration-none fw-bold" style="color: var(--accent-primary);">Inicia Sesión</a>
                    </div>
                </form>

            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config/api.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
