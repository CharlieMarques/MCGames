<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - MCGames</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="../assets/icons/Logo.svg">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .profile-header {
            background: linear-gradient(180deg, var(--bg-secondary) 0%, var(--bg-primary) 100%);
            border-bottom: 1px solid var(--accent-secondary);
        }
        .avatar-container {
            width: 150px;
            height: 150px;
            margin: 0 auto;
            position: relative;
        }
        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border: 4px solid var(--bg-primary);
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
        .btn-camera {
            position: absolute;
            bottom: 5px;
            right: 5px;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }
        .btn-camera:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <div id="navbar-container"></div>

    <main class="container mb-5" style="margin-top: 2rem;">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">
                
                <div class="card bg-dark border-secondary shadow-lg">
                    <div class="card-header profile-header text-center pt-5 pb-4 border-0">
                        <div class="avatar-container mb-3">
                            <img src="https://www.shutterstock.com/image-vector/user-profile-icon-vector-avatar-600nw-2558760599.jpg" id="profile-preview" class="avatar-img rounded-circle" alt="Foto de perfil">
                            
                            <button type="button" class="btn btn-accent btn-camera shadow" onclick="document.getElementById('profile-upload').click()">
                                <i class="bi bi-camera-fill fs-5"></i>
                            </button>
                            <input type="file" id="profile-upload" class="d-none" accept="image/png, image/jpeg, image/webp">
                        </div>
                        <h3 class="text-white fw-bold mb-0" id="display-username">Cargando...</h3>
                        <span class="text-secondary" id="display-role">Jugador</span>
                    </div>

                    <div class="card-body p-4 p-md-5">
                        <form id="form-perfil">
                            
                            <h5 class="text-accent border-bottom border-secondary pb-2 mb-4">Información Personal</h5>
                            
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label text-light small">Nombre</label>
                                    <input type="text" id="input-nombre" class="form-control bg-dark border-secondary text-light" placeholder="Ej: Juan">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label text-light small">Apellido</label>
                                    <input type="text" id="input-apellido" class="form-control bg-dark border-secondary text-light" placeholder="Ej: Pérez">
                                </div>
                            </div>

                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label text-light small">Nombre de Usuario</label>
                                    <input type="text" id="input-username" class="form-control bg-secondary border-secondary text-light" readonly disabled>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label text-light small">Correo Electrónico</label>
                                    <input type="email" id="input-email" class="form-control bg-secondary border-secondary text-light" readonly disabled>
                                </div>
                            </div>

            <h5 class="text-accent border-bottom border-secondary pb-2 mb-4 mt-5">Seguridad</h5>

<button type="button" class="btn btn-outline-secondary mb-3" id="btn-toggle-password">
    <i class="bi bi-key-fill me-2"></i> Cambiar Contraseña
</button>

<div id="password-section" class="d-none bg-secondary bg-opacity-10 p-3 rounded border border-secondary mb-4">
    <div class="row g-3">
        <div class="col-12">
            <label class="form-label text-light small">Contraseña Actual</label>
            <div class="input-group">
                <input type="password" id="input-current-password" class="form-control bg-dark border-secondary text-light" placeholder="Ingresa tu contraseña actual">
                <button class="btn btn-outline-secondary toggle-visibility" type="button" data-target="input-current-password">
                    <i class="bi bi-eye-fill"></i>
                </button>
            </div>
        </div>

        <div class="col-md-6">
            <label class="form-label text-light small">Nueva Contraseña</label>
            <div class="input-group">
                <input type="password" id="input-new-password" class="form-control bg-dark border-secondary text-light" placeholder="Min. 6 caracteres">
                <button class="btn btn-outline-secondary toggle-visibility" type="button" data-target="input-new-password">
                    <i class="bi bi-eye-fill"></i>
                </button>
            </div>
        </div>

        <div class="col-md-6">
            <label class="form-label text-light small">Confirmar Contraseña</label>
            <div class="input-group">
                <input type="password" id="input-confirm-password" class="form-control bg-dark border-secondary text-light" placeholder="Repite la contraseña">
                <button class="btn btn-outline-secondary toggle-visibility" type="button" data-target="input-confirm-password">
                    <i class="bi bi-eye-fill"></i>
                </button>
            </div>
        </div>
    </div>
</div>

                            <hr class="border-secondary mt-5 mb-4">
                            
                            <div class="d-flex justify-content-end gap-2">
                                <button type="button" class="btn btn-outline-secondary" onclick="window.history.back()">Cancelar</button>
                                <button type="submit" class="btn btn-accent" id="btn-save-profile">
                                    <i class="bi bi-save me-2"></i> Guardar Cambios
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config/api.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/profile.js"></script>
</body>
</html>
