<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmar email - MCGames</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="../assets/icons/Logo.svg">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="d-flex align-items-center py-4" style="min-height: 100vh;">

    <main class="w-100 m-auto" style="max-width: 450px;">
        <div class="card shadow-lg border-0" style="background-color: var(--bg-secondary); border-radius: 1rem;">
            <div class="card-body p-5 text-light">

                <div class="text-center mb-4">
                    <i class="bi bi-envelope-check fs-1" style="color: var(--accent-secondary);"></i>
                    <h2 class="fw-bold mt-2">Confirmar email</h2>
                </div>

                <!-- Mientras se confirma -->
                <div id="estado-cargando" class="text-center d-none">
                    <div class="spinner-border" role="status"></div>
                    <p class="mt-3" style="color: var(--text-secondary);">Confirmando tu cuenta...</p>
                </div>

                <!-- Cuenta confirmada -->
                <div id="estado-exito" class="d-none">
                    <div id="mensaje-exito" class="alert alert-success" role="alert"></div>
                    <a href="login.html" class="btn btn-accent w-100 py-2 fw-bold">Iniciar sesión</a>
                </div>

                <!-- Link inválido o vencido, o visita directa: formulario de reenvío -->
                <div id="estado-reenvio" class="d-none">
                    <div id="mensaje-reenvio" class="alert alert-info" role="alert"></div>
                    <form id="resendForm">
                        <div class="mb-3">
                            <label for="resendEmail" class="form-label text-light">Correo electrónico</label>
                            <input type="email" class="form-control bg-dark border-secondary text-light" id="resendEmail" required placeholder="tu@email.com">
                        </div>
                        <button class="btn btn-accent w-100 py-2 fw-bold" type="submit" id="btnResend">Reenviar enlace</button>
                    </form>
                    <div id="resend-result" class="alert mt-3 d-none" role="alert"></div>
                    <div class="text-center mt-3">
                        <a href="login.html" class="text-decoration-none fw-bold" style="color: var(--accent-primary);">Volver a iniciar sesión</a>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script src="../js/config/api.js"></script>
    <script src="../js/confirmar-email.js"></script>
</body>
</html>
