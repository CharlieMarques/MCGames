<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - MCGames</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="../assets/icons/Logo.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div id="navbar-container"></div>

   <main class="container my-5" data-bs-theme="dark">
        <h2 class="text-white fw-bold mb-4"><i class="bi bi-gear-fill text-accent me-2"></i>Panel de Control</h2>

        <ul class="nav nav-tabs mb-4" id="adminTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active text-light" id="games-tab" data-bs-toggle="tab" data-bs-target="#games-panel" type="button" role="tab">Juegos</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link text-light" id="genres-tab" data-bs-toggle="tab" data-bs-target="#genres-panel" type="button" role="tab">Géneros</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link text-light" id="platforms-tab" data-bs-toggle="tab" data-bs-target="#platforms-panel" type="button" role="tab">Plataformas</button>
            </li>
        </ul>

        <div class="tab-content" id="adminTabsContent">
            
            <div class="tab-pane fade show active" id="games-panel" role="tabpanel">
                <div class="card bg-dark border-secondary">
                    <div class="card-header border-secondary d-flex justify-content-between align-items-center p-3">
                        <div class="input-group" style="max-width: 300px;">
                            <input type="text" id="admin-search-game" class="form-control bg-secondary border-secondary text-light" placeholder="Buscar juego...">
                            <button class="btn btn-outline-accent" type="button" onclick="buscarJuegoAdmin()"><i class="bi bi-search"></i></button>
                        </div>
                        <button class="btn btn-accent" onclick="abrirModalJuego()"><i class="bi bi-plus-lg me-1"></i> Nuevo Juego</button>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-dark table-hover mb-0 align-middle">
                                <thead>
                                    <tr>
                                        <th>Portada</th>
                                        <th>Nombre</th>
                                        <th>Precio</th>
                                        <th>Estado</th>
                                        <th class="text-end">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="admin-games-table"></tbody>
                            </table>
                        </div>
                    </div>
                    <div class="card-footer border-secondary bg-transparent d-flex justify-content-center pt-3 pb-2">
                        <nav aria-label="Paginación de admin">
                            <ul class="pagination pagination-sm mb-0" id="admin-games-pagination"></ul>
                        </nav>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade" id="genres-panel" role="tabpanel">
                <div class="card bg-dark border-secondary">
                    <div class="card-header border-secondary d-flex justify-content-between align-items-center p-3">
                        <h5 class="mb-0 text-white"><i class="bi bi-tags me-2"></i>Gestión de Géneros</h5>
                        <button class="btn btn-accent" onclick="abrirModalGenero()"><i class="bi bi-plus-lg me-1"></i> Nuevo Género</button>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-dark table-hover mb-0 align-middle">
                                <thead>
                                    <tr>
                                        <th style="width: 10%;">ID</th>
                                        <th style="width: 70%;">Descripción</th>
                                        <th class="text-end" style="width: 20%;">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="admin-genres-table"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade" id="platforms-panel" role="tabpanel">
                <div class="card bg-dark border-secondary">
                    <div class="card-header border-secondary d-flex justify-content-between align-items-center p-3">
                        <h5 class="mb-0 text-white"><i class="bi bi-pc-display me-2"></i>Gestión de Plataformas</h5>
                        <button class="btn btn-accent" onclick="abrirModalPlataforma()"><i class="bi bi-plus-lg me-1"></i> Nueva Plataforma</button>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-dark table-hover mb-0 align-middle">
                                <thead>
                                    <tr>
                                        <th style="width: 10%;">ID</th>
                                        <th style="width: 70%;">Descripción</th>
                                        <th class="text-end" style="width: 20%;">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="admin-platforms-table"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

        </div> </main>

    <div class="modal fade" id="modalJuego" tabindex="-1" data-bs-theme="dark">
        <div class="modal-dialog modal-lg">
            <div class="modal-content bg-dark border-secondary text-light">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title" id="modalJuegoTitle">Nuevo Juego</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="form-juego">
                        <input type="hidden" id="juego-id">
                        <div class="row g-3">
                            <div class="col-md-8">
                                <label class="form-label small">Nombre del Juego *</label>
                                <input type="text" id="juego-nombre"
                                    class="form-control bg-secondary border-secondary text-light" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small">Precio (USD) *</label>
                                <input type="number" step="0.01" id="juego-precio"
                                    class="form-control bg-secondary border-secondary text-light" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label small">Descripción Corta</label>
                                <textarea id="juego-desc" class="form-control bg-secondary border-secondary text-light"
                                    rows="3"></textarea>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small">URL de Portada (Imagen)</label>
                                <input type="text" id="juego-imagen"
                                    class="form-control bg-secondary border-secondary text-light"
                                    placeholder="https://...">
                            </div>
                            <div class="col-md-6 d-flex align-items-end">
                                <div class="form-check form-switch mb-2">
                                    <input class="form-check-input" type="checkbox" id="juego-estado" checked>
                                    <label class="form-check-label" for="juego-estado">Juego Activo (Visible)</label>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-accent" onclick="guardarJuego()">Guardar Juego</button>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="modalGenero" tabindex="-1" data-bs-theme="dark">
        <div class="modal-dialog">
            <div class="modal-content bg-dark border-secondary text-light">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title" id="modalGeneroTitle">Nuevo Género</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="form-genero">
                        <input type="hidden" id="genero-id">
                        <div class="mb-3">
                            <label class="form-label small">Descripción del Género *</label>
                            <input type="text" id="genero-desc"
                                class="form-control bg-secondary border-secondary text-light" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-accent" onclick="guardarGenero()">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalPlataforma" tabindex="-1" data-bs-theme="dark">
        <div class="modal-dialog">
            <div class="modal-content bg-dark border-secondary text-light">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title" id="modalPlataformaTitle">Nueva Plataforma</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="form-plataforma">
                        <input type="hidden" id="plataforma-id">
                        <div class="mb-3">
                            <label class="form-label small">Descripción de la Plataforma *</label>
                            <input type="text" id="plataforma-desc"
                                class="form-control bg-secondary border-secondary text-light" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-accent" onclick="guardarPlataforma()">Guardar</button>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config/api.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/admin.js"></script>
</body>

</html>
